[project]
name = "cs-researcher"
version = "0.1.0"
description = "Multi-agent cybersecurity research: a coordinator model delegating to analysts on local Ollama models, restricted to trusted sources"
readme = "README.md"
authors = [
    { name = "irongian", email = "me@gllabs.eu" }
]
# CrewAI does not support Python 3.14 yet
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crewai[litellm]>=1.15.33",
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "observra>=1.1",
    "pydantic>=2.12",
    "pypdf>=6.21.4",
]

[project.scripts]
cs-researcher = "cs_researcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
